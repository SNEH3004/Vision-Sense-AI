server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large video uploads
    client_max_body_size 500M;


    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for local JS/CSS so the browser always fetches
    # the latest version after a container rebuild.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Reverse-proxy API calls to the backend container. The frontend
    # calls relative paths like `/api/events/recent`, nginx strips the
    # `/api` prefix and forwards to the backend's own route namespace.
    # No cross-origin request occurs (same-origin from the browser's
    # perspective), so CORS is never triggered in production.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # WebSocket proxy for the live alerts feed. Needs the Upgrade/
    # Connection headers explicitly — without them nginx proxies it as a
    # plain HTTP request and the socket handshake fails.
    location = /ws/alerts {
        proxy_pass         http://backend:8000/events/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
