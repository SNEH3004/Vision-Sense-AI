name: final-project-27
services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vision123}
      POSTGRES_DB: ${POSTGRES_DB:-vision_ai}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ./db/01_events.sql:/docker-entrypoint-initdb.d/01_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: {context: ./backend, dockerfile: ../docker/backend.Dockerfile}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vision_ai}
      DB_USER: ${POSTGRES_USER:-vision}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vision123}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
      MINIO_BUCKET: ${MINIO_BUCKET:-vision-ai}
      MINIO_SECURE: "false"
      UPLOAD_DIRECTORY: /media/uploads
      EXAM_INFERENCE_URL: http://exam_inference:8002/infer
      MALL_INFERENCE_URL: http://mall_inference:8001/infer
      TRAFFIC_INFERENCE_URL: http://traffic_inference:8003/infer
      SUBWAY_INFERENCE_URL: http://subway_inference:8004/infer
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: ["./data/uploads:/media/uploads"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
  mall_inference:
    build: {context: ./inference, dockerfile: ../docker/inference.Dockerfile}
    command: ["uvicorn", "inference.mall.container_app:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes: ["./data/uploads:/media/uploads:ro"]
    ports: ["${MALL_PORT:-8001}:8001"]
    depends_on: {backend: {condition: service_started}}
  exam_inference:
    build: {context: ./inference, dockerfile: ../docker/inference.Dockerfile}
    command: ["uvicorn", "inference.exam_hall.container_app:app", "--host", "0.0.0.0", "--port", "8002"]
    volumes: ["./data/uploads:/media/uploads:ro"]
    ports: ["${EXAM_PORT:-8002}:8002"]
    depends_on: {backend: {condition: service_started}}
  traffic_inference:
    build: {context: ./inference, dockerfile: ../docker/inference.Dockerfile}
    command: ["uvicorn", "inference.traffic.app:app", "--host", "0.0.0.0", "--port", "8003"]
    volumes: ["./data/uploads:/media/uploads:ro"]
    ports: ["${TRAFFIC_PORT:-8003}:8003"]
    depends_on: {backend: {condition: service_started}}
  subway_inference:
    build: {context: ./inference, dockerfile: ../docker/inference.Dockerfile}
    command: ["uvicorn", "inference.railway.app:app", "--host", "0.0.0.0", "--port", "8004"]
    volumes: ["./data/uploads:/media/uploads:ro"]
    ports: ["${SUBWAY_PORT:-8004}:8004"]
    depends_on: {backend: {condition: service_started}}
  router:
    build: {context: ./router, dockerfile: ../docker/router.Dockerfile}
    command: ["uvicorn", "router.compose_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ROUTE_MALL_URL: http://mall_inference:8001/infer
      ROUTE_EXAM_URL: http://exam_inference:8002/infer
    ports: ["${ROUTER_PORT:-8100}:8000"]
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  minio_data: