version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: postgres-container

    restart: always

    environment:

      POSTGRES_USER: vrutika

      POSTGRES_PASSWORD: vrutika123

      POSTGRES_DB: ai_surveillance

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:

    image: minio/minio:latest

    container_name: minio-container

    restart: always

    environment:

      MINIO_ROOT_USER: minioadmin

      MINIO_ROOT_PASSWORD: minioadminpassword

    ports:

      - "9000:9000"

      - "9001:9001"

    volumes:

      - minio_data:/data

    command: server /data --console-address ":9001"

  mall:

    build:

      context: ./Mall

      dockerfile: Dockerfile

    container_name: mall-container

    restart: always

    ports:

      - "8001:8001"

    env_file:

      - ./Mall/.env.txt

    depends_on:

      - postgres

      - minio

volumes:

  postgres_data:

  minio_data: